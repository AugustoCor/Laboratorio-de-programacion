<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Assets/css/style.css">
    <title>Augusto</title>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="logo">LOGO</div>
         <ul class="nav-links" id="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="div"></div>
    </nav>
    <div class="menu-togle" id="mobile-menu">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <!-- Hero Section-->
     <header id="inicio" class="hero">
        <div class="hero-content">
            <h1>Welcome to Augusto</h1>
        <p>Welcome to my page</p>
        <a href="#Services" class="btn-main">Explore now</a>
        </div>
     </header>

    <!--Contact Section-->
    <section id="contacto" class="contact-section">
    <div class="contact-box">
        <h2>Contact Us</h2>
        <p>Have questions or want to learn more? Get in touch with us!</p>

     
        <form id="contactForm" class="form-container">
            <div class="form-group">
                <label for="username">Name</label> 
                <input type="text" id="username" name="username" placeholder="tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="tu mensaje" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar mensaje</button>
        </form>

        <p id="feedback" class="feedback"></p>
    </div>
</section>

    <script src="Assets/js/script.js"></script>
</body>
</html>
